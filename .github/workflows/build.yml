name: Build Glance for macOS 14+

on:
  push:
    branches: [ main, "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal macOS 14 DMG
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build Glance Application
        run: |
          xcodebuild -project glance.xcodeproj \
            -scheme glance \
            -configuration Release \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/Release" \
            clean build

      - name: Codesign App Bundle
        run: |
          codesign --force --deep --sign - "build/Release/Glance.app"

      - name: Package DMG
        run: |
          mkdir -p dmg_root
          cp -R "build/Release/Glance.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Glance" -srcfolder dmg_root -ov -format UDZO "Glance-macOS14-Universal.dmg"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glance-macOS14-Universal-DMG
          path: Glance-macOS14-Universal.dmg
          if-no-files-found: error
